<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura simple de Mi Coach</title>
  <desc id="desc">Tres chats usan adaptadores separados y un motor comun que produce operaciones confirmables y auditadas.</desc>
  <defs>
    <style>
      .box { fill: #f7fafc; stroke: #256b80; stroke-width: 2; rx: 12; }
      .shared { fill: #e5f4f2; stroke: #1c7a70; stroke-width: 2; rx: 12; }
      .action { fill: #fff3cf; stroke: #c98a12; stroke-width: 2; rx: 12; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b3a; text-anchor: middle; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #476273; text-anchor: middle; }
      .arrow { stroke: #587887; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#587887" />
    </marker>
  </defs>

  <rect class="box" x="40" y="28" width="190" height="62" />
  <text class="label" x="135" y="55">Chat Coach</text>
  <text class="small" x="135" y="77">sesion e historial</text>

  <rect class="box" x="265" y="28" width="190" height="62" />
  <text class="label" x="360" y="55">Cliente existente</text>
  <text class="small" x="360" y="77">cuenta CRM fija</text>

  <rect class="box" x="490" y="28" width="190" height="62" />
  <text class="label" x="585" y="55">Cuenta nueva</text>
  <text class="small" x="585" y="77">sesion de prospecto</text>

  <rect class="shared" x="260" y="145" width="450" height="78" />
  <text class="label" x="485" y="178">Motor conversacional comun</text>
  <text class="small" x="485" y="202">interpreta, consulta y responde</text>

  <rect class="action" x="205" y="295" width="240" height="62" />
  <text class="label" x="325" y="322">Operacion propuesta</text>
  <text class="small" x="325" y="344">requiere confirmacion</text>

  <rect class="action" x="520" y="295" width="240" height="62" />
  <text class="label" x="640" y="322">Ejecucion controlada</text>
  <text class="small" x="640" y="344">auditoria y permisos</text>

  <path class="arrow" d="M135 90 V125 H350 V145" />
  <path class="arrow" d="M360 90 V145" />
  <path class="arrow" d="M585 90 V125 H620 V145" />
  <path class="arrow" d="M390 223 V270 H325 V295" />
  <path class="arrow" d="M560 223 V270 H640 V295" />
  <path class="arrow" d="M445 326 H520" />
</svg>
