<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="220" viewBox="0 0 1050 220" role="img" aria-labelledby="title desc">
  <title id="title">Operaciones controladas de Mi Coach</title>
  <desc id="desc">Una propuesta pasa por revision, confirmacion, permisos, ejecucion y auditoria.</desc>
  <defs>
    <style>
      .box { fill: #fff3cf; stroke: #c98a12; stroke-width: 2; rx: 12; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b3a; text-anchor: middle; }
      .arrow { stroke: #587887; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#587887" /></marker>
  </defs>
  <rect class="box" x="20" y="75" width="160" height="58" /><text class="label" x="100" y="110">Propuesta</text>
  <rect class="box" x="220" y="75" width="160" height="58" /><text class="label" x="300" y="110">Revision</text>
  <rect class="box" x="420" y="75" width="160" height="58" /><text class="label" x="500" y="110">Confirmacion</text>
  <rect class="box" x="620" y="75" width="180" height="58" /><text class="label" x="710" y="110">Permisos y version</text>
  <rect class="box" x="840" y="75" width="180" height="58" /><text class="label" x="930" y="110">Ejecucion y auditoria</text>
  <path class="arrow" d="M180 104 H220" /><path class="arrow" d="M380 104 H420" /><path class="arrow" d="M580 104 H620" /><path class="arrow" d="M800 104 H840" />
</svg>
