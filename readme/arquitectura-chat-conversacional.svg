<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura del chat conversacional por canales</title>
  <desc id="description">Flujo de una pregunta desde la interfaz, a través de las rutas y servicio, el adaptador y motor común, el planificador IA que resuelve referencias con candidatos autorizados, herramientas CRM, verificación de evidencia, síntesis y persistencia.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#718096"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#167b78"/>
    </marker>
    <style>
      .bg { fill: #f4f7fa; }
      .title { fill: #17253a; font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #607086; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #6b7b8f; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .node { stroke-width: 1.5; rx: 12; }
      .node-title { fill: #17253a; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node-copy { fill: #4d6076; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node-small { fill: #53667d; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: #718096; stroke-width: 2; marker-end: url(#arrow); }
      .connector-teal { fill: none; stroke: #167b78; stroke-width: 2.5; marker-end: url(#arrow-teal); }
      .connector-dash { fill: none; stroke: #167b78; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-teal); }
      .label-bg { fill: #f4f7fa; }
      .edge-label { fill: #51657b; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend { fill: #53667d; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1120" rx="18"/>
  <text class="title" x="48" y="54">Un turno, de la pregunta a la respuesta</text>
  <text class="subtitle" x="48" y="81">Responsabilidades separadas; permisos y alcance CRM controlados por el servidor.</text>

  <text class="section" x="48" y="125">ENTRADA Y CICLO ASÍNCRONO</text>
  <rect class="node" x="48" y="148" width="180" height="96" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="node-title" x="70" y="184">Vendedor</text>
  <text class="node-copy" x="70" y="208">Pregunta en lenguaje natural</text>

  <rect class="node" x="286" y="148" width="250" height="96" fill="#e7f3f5" stroke="#8dbbc4"/>
  <text class="node-title" x="308" y="184">B1 · Chat web</text>
  <text class="node-copy" x="308" y="208">MiAgentPage · sesión por cuenta</text>

  <rect class="node" x="594" y="148" width="270" height="96" fill="#e7f3f5" stroke="#8dbbc4"/>
  <text class="node-title" x="616" y="184">B2 · Rutas de sesión y jobs</text>
  <text class="node-copy" x="616" y="208">POST pregunta · GET estado</text>

  <rect class="node" x="922" y="148" width="460" height="96" fill="#eaf0f8" stroke="#9aaec7"/>
  <text class="node-title" x="944" y="181">B3 · Servicio del canal</text>
  <text class="node-copy" x="944" y="204">Permisos · ownership · snapshot CRM autorizado</text>
  <text class="node-copy" x="944" y="224">Historial y contexto validados · job account_chat</text>

  <path class="connector" d="M228 196 H278"/>
  <path class="connector" d="M536 196 H586"/>
  <path class="connector" d="M864 196 H914"/>

  <text class="section" x="48" y="296">ORQUESTACIÓN DEL TURNO</text>
  <rect class="node" x="500" y="322" width="440" height="94" fill="#eaf0f8" stroke="#9aaec7"/>
  <text class="node-title" x="526" y="359">B4 · Adaptador del canal</text>
  <text class="node-copy" x="526" y="384">Contexto, herramientas, reglas y formato de respuesta</text>

  <rect class="node" x="500" y="468" width="440" height="100" fill="#dcecf8" stroke="#78a6c9"/>
  <text class="node-title" x="526" y="507">B5 · Motor conversacional</text>
  <text class="node-copy" x="526" y="529">Valida candidato, cuenta, permisos y política</text>
  <text class="node-small" x="526" y="550">Resuelve candidateKey a ID CRM interno</text>

  <rect class="node" x="1010" y="468" width="372" height="100" fill="#fff1d8" stroke="#d7a84e"/>
  <text class="node-title" x="1036" y="503">B6 · Planificador IA</text>
  <text class="node-copy" x="1036" y="528">Interpreta historial y referencia entidades</text>
  <text class="node-small" x="1036" y="550">Elige target · cardinalidad · candidateKey</text>

  <path class="connector" d="M1152 244 V278 H720 V314"/>
  <rect class="label-bg" x="823" y="265" width="198" height="24" rx="6"/>
  <text class="edge-label" x="835" y="282">crea y ejecuta el turno</text>
  <path class="connector" d="M720 416 V460"/>
  <path class="connector-teal" d="M940 518 H1002"/>
  <path class="connector-dash" d="M1010 548 H948 V548 H940"/>
  <rect class="label-bg" x="945" y="520" width="74" height="23" rx="5"/>
  <text class="edge-label" x="953" y="536">plan + alias</text>

  <text class="section" x="48" y="625">RECUPERACIÓN Y VERIFICACIÓN</text>
  <rect class="node" x="500" y="652" width="440" height="92" fill="#eaf5f3" stroke="#87b7ad"/>
  <text class="node-title" x="526" y="688">B7 · Read model del canal</text>
  <text class="node-copy" x="526" y="713">Traduce el plan en consultas concretas</text>
  <rect class="node" x="500" y="790" width="440" height="92" fill="#eaf5f3" stroke="#87b7ad"/>
  <text class="node-title" x="526" y="826">B8 · Herramientas CRM autorizadas</text>
  <text class="node-copy" x="526" y="851">Cuenta fija · oportunidades · contactos · actividades</text>

  <rect class="node" x="1010" y="790" width="372" height="92" fill="#eaf5f3" stroke="#87b7ad"/>
  <text class="node-title" x="1036" y="826">B9 · Verificador de evidencia</text>
  <text class="node-copy" x="1036" y="851">Distingue suficiente, incompleta y error</text>

  <path class="connector" d="M720 568 V644"/>
  <rect class="label-bg" x="742" y="582" width="245" height="25" rx="6"/>
  <text class="edge-label" x="750" y="599">Alias validado -&gt; ID CRM interno</text>
  <path class="connector" d="M720 744 V782"/>
  <path class="connector" d="M940 836 H1002"/>
  <path class="connector-dash" d="M1196 790 V700 H948 V698 H940"/>
  <rect class="label-bg" x="967" y="683" width="230" height="24" rx="6"/>
  <text class="edge-label" x="978" y="700">si falta evidencia, solicita otra lectura</text>

  <text class="section" x="48" y="935">RESPUESTA Y PERSISTENCIA</text>
  <rect class="node" x="1010" y="958" width="372" height="92" fill="#e9f3e8" stroke="#9ab78d"/>
  <text class="node-title" x="1036" y="994">B10 · Respuesta final</text>
  <text class="node-copy" x="1036" y="1019">Determinista o síntesis IA auditada</text>

  <rect class="node" x="500" y="958" width="440" height="92" fill="#eaf0f8" stroke="#9aaec7"/>
  <text class="node-title" x="526" y="994">B11 · Persistencia del servicio</text>
  <text class="node-copy" x="526" y="1019">Job · historial · contexto · traza de calidad</text>

  <path class="connector-teal" d="M1196 882 V950"/>
  <path class="connector" d="M1010 1004 H948"/>
  <path class="connector" d="M500 1004 H260 V260 H411 V252"/>
  <rect class="label-bg" x="428" y="270" width="155" height="24" rx="6"/>
  <text class="edge-label" x="439" y="287">resultado del job</text>

  <rect x="48" y="1070" width="16" height="4" rx="2" fill="#718096"/>
  <text class="legend" x="72" y="1076">Flujo de control</text>
  <rect x="218" y="1070" width="16" height="4" rx="2" fill="#167b78"/>
  <text class="legend" x="242" y="1076">Plan o camino de evidencia</text>
  <text class="legend" x="922" y="1076">Las escrituras requieren revisión y confirmación fuera de este flujo.</text>
</svg>