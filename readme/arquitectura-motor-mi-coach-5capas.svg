<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del motor de Mi Coach en 5 capas</title>
  <desc id="desc">Usuario entra al Chat Coach, la intención se clasifica, luego se resuelve entidad y reglas, se consulta CRM, se valida la respuesta y se ejecutan operaciones controladas.</desc>
  <defs>
    <style>
      .box { fill: #f7fafc; stroke: #256b80; stroke-width: 2; rx: 14; }
      .core { fill: #e7f5f3; stroke: #1f7a72; stroke-width: 2; rx: 14; }
      .action { fill: #fff1cb; stroke: #c48a12; stroke-width: 2; rx: 14; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b3a; text-anchor: middle; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #41596d; text-anchor: middle; }
      .arrow { stroke: #587887; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#587887" />
    </marker>
  </defs>

  <rect class="box" x="50" y="40" width="170" height="68" />
  <text class="label" x="135" y="72">Usuario</text>
  <text class="small" x="135" y="92">vendedor / chat</text>

  <rect class="box" x="260" y="40" width="190" height="68" />
  <text class="label" x="355" y="72">Chat Coach</text>
  <text class="small" x="355" y="92">entrada conversacional</text>

  <rect class="core" x="500" y="40" width="180" height="68" />
  <text class="label" x="590" y="72">IntentClassifier</text>
  <text class="small" x="590" y="92">intención general</text>

  <rect class="core" x="720" y="40" width="180" height="68" />
  <text class="label" x="810" y="72">EntityResolver</text>
  <text class="small" x="810" y="92">entidad candidata</text>

  <rect class="core" x="940" y="40" width="220" height="68" />
  <text class="label" x="1050" y="72">BusinessRuleEngine</text>
  <text class="small" x="1050" y="92">reglas + permisos + scope</text>

  <rect class="box" x="1210" y="40" width="180" height="68" />
  <text class="label" x="1300" y="72">DataAccessLayer</text>
  <text class="small" x="1300" y="92">consultas CRM</text>

  <rect class="box" x="1410" y="40" width="170" height="68" />
  <text class="label" x="1495" y="72">ResponseValidator</text>
  <text class="small" x="1495" y="92">valida salida</text>

  <rect class="action" x="710" y="190" width="300" height="74" />
  <text class="label" x="860" y="220">Proceso comercial</text>
  <text class="small" x="860" y="240">etapas, preguntas y criterios</text>

  <rect class="action" x="1035" y="190" width="260" height="74" />
  <text class="label" x="1165" y="220">CRM</text>
  <text class="small" x="1165" y="240">hechos, estados, permisos</text>

  <rect class="action" x="665" y="300" width="300" height="72" />
  <text class="label" x="815" y="332">Respuesta final</text>
  <text class="small" x="815" y="352">evidencia + contexto + recomendación</text>

  <rect class="action" x="1015" y="300" width="290" height="72" />
  <text class="label" x="1160" y="332">Operación propuesta</text>
  <text class="small" x="1160" y="352">confirmación + ejecución controlada</text>

  <path class="arrow" d="M220 74 H260" />
  <path class="arrow" d="M450 74 H500" />
  <path class="arrow" d="M680 74 H720" />
  <path class="arrow" d="M900 74 H940" />
  <path class="arrow" d="M1160 74 H1210" />
  <path class="arrow" d="M1390 74 H1410" />

  <path class="arrow" d="M1050 108 V150 H860 V190" />
  <path class="arrow" d="M1050 108 V150 H1165 V190" />
  <path class="arrow" d="M1495 108 V140 H1160 V300" />
  <path class="arrow" d="M860 264 V300" />
  <path class="arrow" d="M1160 264 V300" />
  <path class="arrow" d="M975 336 H1015" />
</svg>
